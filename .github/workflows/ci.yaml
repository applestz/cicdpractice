name: Deploy ON Push

on:
  push:
    branches:
      - main

jobs:
  check: #job name
    runs-on: ubuntu-latest
    steps:
      - name: Clone codebase
        uses: actions/checkout@v6
      - name: Check If File Exist
        run: |
          ls -la
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
